# Config del proxy LiteLLM standalone (perfil "gateway" de docker-compose).
# El backend NO depende de esto: usa LiteLLM como librería con los proveedores
# configurados en su BD. Este proxy es útil si quieres un endpoint OpenAI "en crudo"
# con claves virtuales gestionadas por LiteLLM.
#
# Documentación: https://docs.litellm.ai/docs/proxy/configs

model_list:
  # Ejemplos — sustituir por tus modelos y claves (mejor vía variables de entorno)
  # - model_name: claude-fable-5
  #   litellm_params:
  #     model: anthropic/claude-fable-5
  #     api_key: os.environ/ANTHROPIC_API_KEY
  # - model_name: llama-local
  #   litellm_params:
  #     model: ollama/llama3
  #     api_base: http://ollama:11434

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
