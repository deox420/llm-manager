services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: llm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llm}
      POSTGRES_DB: llm_manager
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm -d llm_manager"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      LLMM_DATABASE_URL: postgresql+asyncpg://llm:${POSTGRES_PASSWORD:-llm}@postgres:5432/llm_manager
      LLMM_REDIS_URL: redis://redis:6379/0
      LLMM_SECRET_KEY: ${LLMM_SECRET_KEY:?definir en .env}
      LLMM_ENCRYPTION_KEY: ${LLMM_ENCRYPTION_KEY:?definir en .env}
      LLMM_EMBEDDING_MODEL: ${LLMM_EMBEDDING_MODEL:-}
      LLMM_EMBEDDING_DIM: ${LLMM_EMBEDDING_DIM:-1536}
      LLMM_VAULT_DATA_DIR: /data/vaults
      LLMM_CORS_ORIGINS: ${LLMM_CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - vaultdata:/data/vaults
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

  # Perfil opcional: proxy LiteLLM standalone (endpoint OpenAI "en crudo" sin pasar por el backend)
  litellm:
    profiles: ["gateway"]
    image: ghcr.io/berriai/litellm:main-latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      DATABASE_URL: postgresql://llm:${POSTGRES_PASSWORD:-llm}@postgres:5432/llm_manager
    ports:
      - "4000:4000"

  # Perfil opcional: inferencia local con Ollama
  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  pgdata:
  redisdata:
  vaultdata:
  ollamadata:
